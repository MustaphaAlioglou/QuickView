name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python install.sh accepts, and the newest.
        python: ["3.10", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # The libraries the PySide6 wheels load even offscreen; a bare runner
      # lacks some of them and the first import fails rather than a test.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libgssapi-krb5-2 fonts-dejavu-core

      # Writer alone, without a GUI: the one office test that converts a real
      # .docx skips without it, and every other office test fakes the suite.
      - name: Install LibreOffice
        run: sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui

      # The full PySide6 rather than PySide6-Essentials: QtPdf is an add-on.
      - name: Install Python dependencies
        run: python -m pip install PySide6 Pygments

      - name: Run tests
        run: python -m unittest discover -v -s tests -t .
